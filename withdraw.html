<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>উইথড্র</title></head><body><main class="wrap"><a class="brand" href="dashboard.html">TaskEarn</a><section class="panel"><h1>উইথড্র অনুরোধ</h1><p>সর্বনিম্ন ১০,০০০ পয়েন্ট। ১০০ পয়েন্ট = ১ টাকা। অনুরোধ জমা দিলে পয়েন্ট সাময়িকভাবে কেটে রাখা হবে। বাতিল হলে ফেরত হবে। এটি কোনো স্বয়ংক্রিয় টাকা পাঠানোর ব্যবস্থা নয়।</p><form id="withdrawForm"><label>পয়েন্ট</label><input id="withdrawPoints" type="number" min="10000" step="100" required><label>মাধ্যম</label><select id="method"><option>bKash</option><option>Nagad</option></select><label>ওয়ালেট নম্বর</label><input id="number" inputmode="tel" minlength="10" maxlength="20" required><button>অনুরোধ জমা দিন</button></form><p id="message" aria-live="polite"></p></section></main><script type="module" src="js/app.js"></script></body></html>
